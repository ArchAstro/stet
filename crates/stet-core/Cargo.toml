[package]
name = "stet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Platform-free editing core: buffer, vim, markdown, suggestions, themes"

[dependencies]
ropey = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
memchr = "2"
unicode-width = "0.2"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
