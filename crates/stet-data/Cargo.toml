[package]
name = "stet-data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A first look at data files for stet: schema, row count and first rows of CSV, JSON, Parquet, Arrow and SQLite"

[dependencies]
serde_json = "1"
csv = "1.4"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "flate2-rust_backend", "lz4"] }
arrow-ipc = "60"
arrow-array = "60"
arrow-schema = "60"
arrow-cast = { version = "60", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
