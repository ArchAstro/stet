[package]
name = "stet-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Windowed shell for stet: winit + wgpu"

[[bin]]
name = "stet"
path = "src/main.rs"

[dependencies]
stet-core = { path = "../stet-core" }
stet-kernel = { path = "../stet-kernel" }
stet-chart = { path = "../stet-chart" }
stet-data = { path = "../stet-data" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
winit = "0.30"
wgpu = "30"
glyphon = "0.12"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
open = "5"
ureq = { version = "3", optional = true }
stet-substack = { path = "../stet-substack", optional = true }
stet-youtube = { path = "../stet-youtube", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }

[features]
default = ["remote-images", "substack", "youtube"]
# Publish a document to Substack as a draft.
substack = ["dep:stet-substack"]
# Sign in to YouTube, and upload a published document's videos there.
youtube = ["dep:stet-youtube"]
# Fetch images referenced by http(s) URLs.
remote-images = ["dep:ureq"]
