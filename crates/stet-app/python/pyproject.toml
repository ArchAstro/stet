[project]
name = "stet-notebook"
version = "0.4.0"
description = "Stet's side of a notebook kernel: tables, native charts, themed matplotlib, data refs. Stet loads it into kernels itself; install it only to import stet elsewhere."
requires-python = ">=3.9"
license = "MIT"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stet"]
