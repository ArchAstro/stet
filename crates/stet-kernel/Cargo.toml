[package]
name = "stet-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Run code for stet's notebook mode: Jupyter kernels over ZeroMQ, behind a blocking handle"

[dependencies]
jupyter-protocol = "2.0.3"
jupyter-zmq-client = "2.0.0"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
