[workspace]
resolver = "2"
members = ["crates/stet-core", "crates/stet-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ArchAstro/stet"
homepage = "https://github.com/ArchAstro/stet"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
